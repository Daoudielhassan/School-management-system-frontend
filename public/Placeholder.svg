		height="100"
		fill="none"
		stroke="currentColor"
		stroke-width="2"
>
	<!-- Head -->
	<circle cx="50" cy="30" r="15" />
	<!-- Body -->
	<line x1="50" y1="45" x2="50" y2="75" />
	<!-- Arms -->
	<line x1="30" y1="55" x2="70" y2="55" />
	<!-- Legs -->
	<line x1="50" y1="75" x2="30" y2="95" />
	<line x1="50" y1="75" x2="70" y2="95" />
</svg>